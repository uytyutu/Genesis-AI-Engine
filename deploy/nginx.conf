# Virtus Core — reverse proxy
#  /api /health /webhooks /status  → genesis:8000  (API)
#  everything else                 → frontend:3000 (public storefront /site)
#
# Public API Farm upstream (RapidAPI):
#   Prefer https://api.genesis-ai-engine.com after Cloudflare A → 137.74.173.134 + certbot.
#   Interim: http://137.74.173.134 (JSON API already live).

resolver 127.0.0.11 valid=10s ipv6=off;

# Shared proxy snippets via repeated blocks (alpine nginx: no includes required).

server {
    listen 80;
    # API domain (Cloudflare) + legacy virtuscore + IP until DNS cutover.
    server_name api.genesis-ai-engine.com api.virtuscore.com _;

    client_max_body_size 50m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # ACME HTTP-01 (certbot webroot) — enable volume + certbot after DNS → OVH.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- API / webhooks (backend) ---
    location /health {
        set $genesis_upstream http://genesis:8000;
        proxy_pass $genesis_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /status {
        set $genesis_upstream http://genesis:8000;
        proxy_pass $genesis_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $genesis_upstream http://genesis:8000;
        proxy_pass $genesis_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /webhooks/ {
        set $genesis_upstream http://genesis:8000;
        proxy_pass $genesis_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Public storefront (Next.js vitrine) ---
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

