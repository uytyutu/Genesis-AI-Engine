<!-- Virtus Core scene_3d_engine -->
<div id="virtus-3d-hero" class="virtus-3d-hero" data-niche="beauty" data-brand="Salon Mira" style="position:relative;width:100%;min-height:100vh;height:100vh;max-height:none;overflow:hidden;border-radius:0;background:radial-gradient(ellipse at 40% 30%, #3b82f633, #0b0f14 70%);">
  <canvas id="virtus-3d-canvas" style="display:block;width:100%;height:100%;"></canvas>
  <div id="virtus-3d-fallback" class="virtus-3d-fallback" hidden style="position:absolute;inset:0;align-items:center;justify-content:center;perspective:900px;">
    <div class="virtus-tilt-card" style="width:min(88%,420px);aspect-ratio:16/10;border-radius:16px;background:linear-gradient(145deg,#3b82f6aa,#111827);box-shadow:0 24px 60px rgba(0,0,0,.45);transform:rotateY(-12deg) rotateX(8deg);display:flex;align-items:flex-end;padding:1.25rem;color:#fff;font:600 1.1rem/1.3 system-ui,sans-serif;">Salon Mira</div>
  </div>
</div>
<script>
(function(){
  var root = document.getElementById('virtus-3d-hero');
  var canvas = document.getElementById('virtus-3d-canvas');
  var fallback = document.getElementById('virtus-3d-fallback');
  var niche = 'beauty';
  var accent = '#3b82f6';
  function showFallback(){
    if (canvas) canvas.style.display = 'none';
    if (fallback) { fallback.hidden = false; fallback.style.display = 'flex'; }
  }
  function ensureThree(cb){
    if (window.THREE) { cb(); return; }
    var existing = document.querySelector('script[data-virtus-three]');
    if (existing) {
      existing.addEventListener('load', function(){ cb(); });
      existing.addEventListener('error', showFallback);
      return;
    }
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/three@0.160.0/build/three.min.js';
    s.async = true;
    s.setAttribute('data-virtus-three', '1');
    s.onload = function(){ cb(); };
    s.onerror = showFallback;
    document.head.appendChild(s);
  }
  function startScene(){
  if (!window.THREE || !canvas || !root) { showFallback(); return; }
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try {
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    var w = root.clientWidth || window.innerWidth || 640;
    var h = root.clientHeight || window.innerHeight || 360;
    if (w < 32 || h < 32) { w = window.innerWidth || 960; h = window.innerHeight || 640; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    renderer.setClearColor(0x000000, 0);
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
    camera.position.set(0, 1.35, 3.35);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a22, 1.25));
    var key = new THREE.DirectionalLight(0xfff6e8, 1.35);
    key.position.set(3, 5, 2);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0x88aaff, 0.45);
    fill.position.set(-3, 2, -1);
    scene.add(fill);
    var accentC = new THREE.Color(accent);
    var mat = new THREE.MeshStandardMaterial({ color: accentC, metalness: 0.55, roughness: 0.35 });
    var matDark = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.4, roughness: 0.45 });
    var matGloss = new THREE.MeshStandardMaterial({ color: accentC, metalness: 0.92, roughness: 0.12 });
    var group = new THREE.Group();
    group.scale.set(1.25, 1.25, 1.25);
    scene.add(group);

    function addCar(g, gloss){
      var body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.35, 0.9), gloss || mat);
      body.position.y = 0.45; g.add(body);
      var cabin = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.35, 0.82), matDark);
      cabin.position.set(-0.15, 0.75, 0); g.add(cabin);
      [[-0.55,-0.45],[0.55,-0.45],[-0.55,0.45],[0.55,0.45]].forEach(function(p){
        var wh = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,0.12,16), matDark);
        wh.rotation.z = Math.PI/2; wh.position.set(p[0], 0.18, p[1]); g.add(wh);
      });
    }

    if (niche === 'auto') {
      var lift = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.1), matDark);
      lift.position.y = 0.9; group.add(lift);
      [[-1,0.45],[1,0.45]].forEach(function(p){
        var post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, 0.12), mat);
        post.position.set(p[0], 0.45, p[1]); group.add(post);
      });
      var carG = new THREE.Group(); carG.position.y = 0.55; addCar(carG, mat); group.add(carG);
    } else if (niche === 'dental') {
      var tooth = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 24), new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.05, roughness: 0.25 }));
      tooth.scale.set(0.75, 1.15, 0.7); tooth.position.y = 0.55; group.add(tooth);
    } else if (niche === 'orthodontics') {
      for (var i = 0; i < 7; i++) {
        var a = (i / 6) * Math.PI - Math.PI / 2;
        var s = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.1, roughness: 0.3 }));
        s.position.set(Math.cos(a) * 1.1, 0.35 + Math.sin(a) * 0.35, 0);
        group.add(s);
      }
    } else if (niche === 'detailing' || niche === 'auto_detailing') {
      addCar(group, matGloss);
      var floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 48), new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.8, roughness: 0.2 }));
      floor.rotation.x = -Math.PI/2; group.add(floor);
    } else if (niche === 'furniture') {
      var seat = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.28, 0.9), mat);
      seat.position.y = 0.45; group.add(seat);
      var back = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 0.22), matDark);
      back.position.set(0, 0.85, -0.34); group.add(back);
      [[-0.75,0.22,-0.35],[0.75,0.22,-0.35],[-0.75,0.22,0.35],[0.75,0.22,0.35]].forEach(function(p){
        var leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), matDark);
        leg.position.set(p[0], p[1], p[2]); group.add(leg);
      });
    } else if (niche === 'jewelry') {
      var ring = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.12, 24, 64), matGloss);
      ring.rotation.x = Math.PI / 2.6; group.add(ring);
    } else if (niche === 'energy' || niche === 'solar') {
      var roof = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 1.4), matDark);
      roof.rotation.x = -0.35; roof.position.y = 0.7; group.add(roof);
      for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) {
        var panel = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.04, 0.35), mat);
        panel.position.set(-0.75 + c * 0.5, 0.78, -0.35 + r * 0.4);
        panel.rotation.x = -0.35; group.add(panel);
      }
    } else if (niche === 'car_dealership') {
      var showFloor = new THREE.Mesh(
        new THREE.CircleGeometry(3.2, 64),
        new THREE.MeshStandardMaterial({ color: 0x0f1218, metalness: 0.92, roughness: 0.18 })
      );
      showFloor.rotation.x = -Math.PI / 2; group.add(showFloor);
      var spot = new THREE.SpotLight(0xfff4e0, 1.35, 12, 0.55, 0.4);
      spot.position.set(2.2, 4.2, 2.5); spot.target.position.set(0, 0.4, 0);
      group.add(spot); group.add(spot.target);
      addCar(group, matGloss);
      for (var pi = 0; pi < 28; pi++) {
        var spark = new THREE.Mesh(
          new THREE.SphereGeometry(0.02, 6, 6),
          new THREE.MeshBasicMaterial({ color: accentC })
        );
        spark.position.set((Math.random() - 0.5) * 4, 0.4 + Math.random() * 2.2, (Math.random() - 0.5) * 3);
        group.add(spark);
      }
    } else if (niche === 'nail' || niche === 'nail_studio' || niche === 'beauty' || niche === 'spa' || niche === 'kosmetik') {
      // Soft glass / float — sells calm luxury atmosphere, not a spinning polish bottle
      var glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xfff5f8, metalness: 0.05, roughness: 0.12, transmission: 0.55,
        transparent: true, opacity: 0.85, ior: 1.4
      });
      var orb = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 24), glassMat);
      orb.position.set(-0.6, 0.7, 0); group.add(orb);
      var orb2 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 16), glassMat);
      orb2.position.set(0.75, 1.1, 0.2); group.add(orb2);
      var plate = new THREE.Mesh(
        new THREE.CylinderGeometry(1.1, 1.1, 0.06, 48),
        new THREE.MeshStandardMaterial({ color: accentC, metalness: 0.35, roughness: 0.4 })
      );
      plate.position.y = 0.05; group.add(plate);
      for (var gi = 0; gi < 16; gi++) {
        var mote = new THREE.Mesh(
          new THREE.SphereGeometry(0.025, 8, 8),
          new THREE.MeshBasicMaterial({ color: accentC, transparent: true, opacity: 0.7 })
        );
        mote.position.set((Math.random()-0.5)*2.2, 0.3+Math.random()*1.6, (Math.random()-0.5)*1.4);
        group.add(mote);
      }
    } else if (niche === 'elektro') {
      var box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.35), matDark);
      box.position.y = 0.7; group.add(box);
      for (var e = 0; e < 4; e++) {
        var sw = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.08), mat);
        sw.position.set(-0.3 + (e % 2) * 0.6, 0.95 - Math.floor(e / 2) * 0.5, 0.2);
        group.add(sw);
      }
    } else {
      group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), mat));
    }

    var t0 = performance.now();
    function frame(now){
      var t = (now - t0) / 1000;
      if (!reduced) { group.rotation.y = t * 0.35; group.position.y = Math.sin(t * 0.9) * 0.06; }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    window.addEventListener('resize', function(){
      w = root.clientWidth || 640; h = root.clientHeight || 360;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    });
    requestAnimationFrame(frame);
  } catch (err) {
    showFallback();
  }
  }
  ensureThree(startScene);
})();
</script>
